syntax = "proto3";

package unity.v1;

service AnimateService {
  rpc Act (ActRequest) returns (ActResponse);
  rpc GetVersion (VersionRequest) returns (VersionResponse);
  rpc GetEntities (GetEntitiesRequest) returns (GetEntitiesResponse);
  rpc NavigateTo (NavigateToRequest) returns (NavigateToResponse);
  rpc ActionChunk (ActionChunkRequest) returns (ActionChunkResponse);
  rpc GetObservation (GetObservationRequest) returns (GetObservationResponse);
}

// --- existing messages unchanged ---
message ActRequest {
  string action_name = 1;
}
message ActResponse {
  bool success = 1;
  string message = 2;
}
message VersionRequest {}
message VersionResponse {
  string proto_version = 1;
  string server_version = 2;
}

// --- GetEntities ---
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Entity {
  string id = 1;
  string name = 2;
  string type = 3;              // e.g. "npc", "prop", "robot_link"
  Vector3 position = 4;
  Vector3 rotation_euler = 5;   // degrees; swap for a quaternion Vector4 if you need it
  map<string, string> metadata = 6;  // escape hatch for anything not worth a proper field
}

message GetEntitiesRequest {}

message GetEntitiesResponse {
  repeated Entity entities = 1;
}

message NavigateToRequest {
  string entity_id = 1;      // which entity/agent should move
  Vector3 destination = 2;   // reuses the Vector3 message already defined
  float speed = 3;           // optional; 0 = use default
}

message NavigateToResponse {
  bool success = 1;
  string message = 2;
}

// --- ActionChunk ---
// Flatten any N-D array to `data` (row-major) + `shape`.
// e.g. a (50, 7) chunk -> shape = [50, 7], data = 350 floats.
message NDArray {
  repeated int32 shape = 1;
  repeated float data = 2;
}

message ActionChunkRequest {
  NDArray actions = 1;
  int64 timestamp_ms = 2;   // client-side send time, useful for latency debugging
}

message ActionChunkResponse {
  bool success = 1;
  string message = 2;
}

// --- GetObservation ---
message Image {
  bytes data = 1;
  int32 width = 2;
  int32 height = 3;
  int32 channels = 4;
  string encoding = 5;   // "png", "jpeg", or "raw_rgb8" / "raw_rgba8" for uncompressed
}

message GetObservationRequest {}

message GetObservationResponse {
  map<string, Image> vision = 1;    // keyed by camera name, e.g. "front_cam", "wrist_cam"
  map<string, NDArray> state = 2;    // e.g. "joint_positions", "joint_velocities"
  int64 timestamp_ms = 4;
}